<!DOCTYPE html>
<html>
<head>
    <title>Archana | Hacker Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: black;
            color: #00ff00;
            font-family: "Courier New", monospace;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.1;
        }

        header {
            text-align: center;
            padding: 30px;
            border-bottom: 1px solid #00ff00;
        }

        h1 {
            margin: 0;
            text-shadow: 0 0 10px #00ff00;
        }

        #typing-text {
            margin-top: 10px;
        }

        .terminal {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #00ff00;
            min-height: 300px;
        }

        .input-line {
            display: flex;
        }

        .prompt {
            margin-right: 5px;
        }

        input {
            background: black;
            border: none;
            color: #00ff00;
            font-family: "Courier New", monospace;
            width: 100%;
            outline: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #00ff00;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<canvas id="matrix"></canvas>

<header>
    <h1>M ARCHANA</h1>
    <p id="typing-text"></p>
</header>

<div class="terminal" id="terminal">
    <div>> Type "help" to see available commands</div>
</div>

<footer>
    > Hacker Portfolio Console v1.0
</footer>

<script>
    // MATRIX EFFECT
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const letters = "01";
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ff00";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = letters[Math.floor(Math.random() * letters.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }

            drops[i]++;
        }
    }

    setInterval(drawMatrix, 35);


    // TYPING INTRO
    const introText = "Electronics and Communication Student |Tech Enthusiast";
    const typingElement = document.getElementById("typing-text");
    let index = 0;

    function typeEffect() {
        if (index < introText.length) {
            typingElement.innerHTML += introText.charAt(index);
            index++;
            setTimeout(typeEffect, 50);
        }
    }

    typeEffect();


    // TERMINAL LOGIC
    const terminal = document.getElementById("terminal");

    function addInputLine() {
        const inputLine = document.createElement("div");
        inputLine.className = "input-line";
        inputLine.innerHTML = '<span class="prompt">></span><input type="text" autofocus />';
        terminal.appendChild(inputLine);
        inputLine.querySelector("input").focus();

        inputLine.querySelector("input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                const command = this.value.trim().toLowerCase();
                this.disabled = true;
                processCommand(command);
            }
        });
    }

    function processCommand(command) {
        const output = document.createElement("div");

        switch(command) {
            case "help":
                output.innerHTML = "Available commands: about, skills, projects, clear";
                break;

            case "about":
                output.innerHTML = "I am Archana, a First year Electronics and Communication student passionate about programming and tech innovation. I love building things like apps and websites, and also I am good at designing.";
                break;

            case "skills":
                output.innerHTML = "Skills: C Programming, HTML, CSS, Python Programming, Problem Solving";
                break;

            case "projects":
                output.innerHTML = "Projects: To-Do app, Portfolio Website";
                break;

            case "clear":
                terminal.innerHTML = "";
                addInputLine();
                return;

            default:
                output.innerHTML = "Command not recognized. Type 'help'.";
        }

        terminal.appendChild(output);
        addInputLine();
        terminal.scrollTop = terminal.scrollHeight;
    }

    addInputLine();
</script>

</body>
</html>
